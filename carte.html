<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guillaume Avenel – Carte de visite</title>
<meta name="description" content="Guillaume Avenel, formateur professionnel d'adultes. Carte de visite numérique.">
<meta name="theme-color" content="#ffffff">
<style>
  :root{
    --bg:#ffffff; --surface:#FAFAF8; --ink:#1C1B1A; --muted:#6B6864; --line:rgba(28,27,26,.11);
    --accent:#52796F; --accent-ink:#ffffff; --accent-soft:rgba(82,121,111,.11);
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font:100%/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

  .vcard-wrap{container-type:inline-size;width:min(90vw,500px)}
  .vcard{aspect-ratio:1.6/1;perspective:1100px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .vcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 600ms var(--ease-out)}
  .vcard.flipped .vcard-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:6cqw;border-radius:16px;overflow:hidden;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    box-shadow:0 24px 50px -22px rgba(28,27,26,.4);
  }
  .face.front{background:var(--surface);border:1px solid var(--line)}
  .face.back{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg)}
  .bc-avatar{
    position:relative;overflow:hidden;width:15cqw;height:15cqw;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
    font-size:5cqw;font-weight:600;letter-spacing:.03em;
  }
  .bc-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bc-bar{display:block;width:8cqw;height:3px;border-radius:2px;background:var(--accent);margin-bottom:3cqw}
  .bc-name{font-size:max(20px,7.4cqw);font-weight:700;letter-spacing:-.025em;line-height:1.08;overflow-wrap:anywhere}
  .bc-role{margin-top:1.2cqw;font-size:max(12px,3.9cqw);color:var(--muted);line-height:1.35}
  .bc-tags{font-size:max(9.5px,2.7cqw);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;line-height:1.4}
  .bc-title{font-size:max(10px,2.8cqw);letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.8}
  .bc-list{display:flex;flex-direction:column;gap:3.2cqw}
  .bc-item{min-width:0}
  .bc-item[hidden]{display:none}
  .bc-item small{display:block;font-size:max(9.5px,2.6cqw);letter-spacing:.1em;text-transform:uppercase;opacity:.72;font-weight:600}
  .bc-item a{display:block;margin-top:.5cqw;font-size:max(12px,4.2cqw);font-weight:650;text-decoration:none;color:inherit;overflow-wrap:anywhere;line-height:1.3}

  .below{display:flex;flex-direction:column;align-items:center;gap:14px}
  .hint{
    font:inherit;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    color:var(--muted);background:none;border:0;cursor:pointer;padding:8px 12px;
  }
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;
    border-radius:999px;font:inherit;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink);
    transition:background-color 150ms ease,transform 120ms ease-out;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn[hidden]{display:none}
  .btn:active{transform:scale(.97)}
  @media (hover:hover) and (pointer:fine){
    .btn:hover{background:var(--accent-soft)}
    .btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
  }

  @media (prefers-reduced-motion: reduce){
    .vcard-inner{transition:none;transform:none!important}
    .face{transition:opacity 200ms ease}
    .face.back{transform:none;opacity:0;pointer-events:none}
    .vcard.flipped .face.back{opacity:1;pointer-events:auto}
    .vcard.flipped .face.front{opacity:0;pointer-events:none}
    .btn:active{transform:none}
  }
  @media (max-height:520px){ body{gap:12px} .btn{min-height:40px} }
</style>
</head>

  const $ = id => document.getElementById(id);

  if (CONTACT.photo){
    const im = new Image(); im.alt = "";
    im.onload = () => $("bc-photo").appendChild(im);
    im.src = CONTACT.photo;
  }
  if (CONTACT.phone){
    $("bc-tel").textContent = CONTACT.phone;
    $("bc-tel").href = "tel:" + CONTACT.phone.replace(/[^\d+]/g, "");
    $("bc-tel-row").hidden = false;
  }
  if (CONTACT.email){
    $("bc-mail").textContent = CONTACT.email;
    $("bc-mail").href = "mailto:" + CONTACT.email + "?subject=" + encodeURIComponent("Prise de contact");
    $("bc-mail-row").hidden = false;
  }
  if (CONTACT.phone || CONTACT.email) $("vcf").hidden = false;

  const card = $("bc"), front = $("bc-front"), back = $("bc-back"), flipBtn = $("flip");
  function setFlip(on){
    card.classList.toggle("flipped", on);
    front.inert = on; back.inert = !on;
    front.setAttribute("aria-hidden", on); back.setAttribute("aria-hidden", !on);
    flipBtn.setAttribute("aria-pressed", on);
    flipBtn.textContent = on ? "Touchez pour revenir au recto" : "Touchez pour retourner";
  }
  card.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    setFlip(!card.classList.contains("flipped"));
  });
  flipBtn.addEventListener("click", () => setFlip(!card.classList.contains("flipped")));
  setFlip(false);

  $("vcf").addEventListener("click", () => {
    const esc = s => String(s).replace(/([,;\\])/g, "\\$1");
    const vcf = [
      "BEGIN:VCARD", "VERSION:3.0",
      `N:${esc(CONTACT.lastName)};${esc(CONTACT.firstName)};;;`,
      `FN:${esc(CONTACT.firstName)} ${esc(CONTACT.lastName)}`,
      `TITLE:${esc(CONTACT.title)}`,
      CONTACT.phone ? `TEL;TYPE=CELL:${CONTACT.phone}` : "",
      CONTACT.email ? `EMAIL:${CONTACT.email}` : "",
      `URL:${CONTACT.url}`,
      "END:VCARD"
    ].filter(Boolean).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([vcf], {type: "text/vcard"}));
    a.download = "Guillaume-Avenel.vcf";
    document.body.appendChild(a); a.click(); a.remove();
  });
